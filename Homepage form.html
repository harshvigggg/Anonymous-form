Restriction\":\"As a private service provider, Careloop | Klett cannot admit candidates from countries on the WHO list into the recruitment process. If candidates permanently reside in another country or completed their studies in a country other than the one specified, please contact partner@careloop.io.\"},\"errors\":{\"default\":{\"title\":\"Something went wrong\",\"message\":\"Please contact Careloop Support at info@careloop.io\"},\"invalid_role\":{\"title\":\"Invalid role\",\"message\":\"Please contact \u003ca href=\\\"mailto:info@careloop.io\\\"\u003eCareloop Support\u003c/a\u003e\"},\"page_not_found\":{\"title\":\"Page not found\",\"message\":\"The requested page does not exist\",\"link\":\"Back to home\",\"linkUrl\":\"/\"},\"email_not_verified\":{\"title\":\"Email not verified\",\"message\":\"Please verify your email address by clicking the link in our email\",\"isLoading\":\"Loading data ...\",\"request\":\"Request new email\",\"alreadyVerified\":\"Email already verified\",\"emailSent\":{\"title\":\"Email sent\",\"message\":\"Please check your inbox. This may take a few minutes.\"}},\"offers\":{\"heading\":\"Booking not possible.\",\"retryButton\":\"Try again.\"}},\"documents\":{\"validUntil\":\"Valid until:\",\"info\":{\"Passport\":\"The German authorities require a colour copy of the passport. If no passport is available yet, it can be submitted later — in that case please upload proof that one has been applied for. The passport should be valid for at least one year. In some federal states a plain colour copy is enough, but sometimes a copy certified by the German embassy is required.\",\"Nationales Ausweisdokument\":\"A valid national ID document is required. If no passport is available yet, proof that one has been applied for can be uploaded. The passport must then be uploaded later, as it is needed for every official procedure.\",\"Ausbildungsurkunde\":\"Proof of the diploma or the training certificate is always required, whether or not an assessment notice is already available. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Notenübersicht\":\"An overview of all grades from the studies is required. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Kursübersicht\":\"An overview of all courses from the studies is required, stating the exact total of practical and theoretical hours per subject. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Deutschzertifikat\":\"A plain copy of the fully passed B1 or B2 German certificate is required. It may consist of several partial certificates. Whether the B1 or the B2 level is required for entry to Germany is decided by the respective employer.\",\"Lebenslauf\":\"A CV is required both by the German authorities and by employers. It must be on file before the profile is verified and released for placement. The information can be entered directly on the platform, which then creates the CV automatically.\",\"Lizenz als Pflegekraft\":\"The licence or professional permit from the home country is required. In some countries (e.g. Turkey or Morocco) the diploma can replace this licence. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Anerkennungsergebnis\":\"If the recognition result or an assessment notice is already available, the document can be uploaded here. If the recognition procedure is organised as part of the process, the result is uploaded automatically as soon as it is available.\",\"Praktikumsübersicht\":\"An overview of the internships completed is required — including the exact total hours, the hospital and the department. In some countries this is already contained in the course overview. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Leumundszeugnis\":\"A certificate of good standing is required. This is a confirmation from the health authority in the home or country of residence stating that no professional disciplinary measures are in place and that there are no objections to practising the profession. This proof is required for recognition in Germany. The document must not be older than three months when it is submitted.\",\"Führungszeugnis\":\"A police certificate of good conduct from the home or country of residence is required for recognition. The document must not be older than three months when it is submitted.\",\"High School Diplom\":\"The recognition authority requires the school leaving certificate. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Arbeitszeugnisse\":\"Employment references are not strictly required for the process. Where an adaptation course is planned, employment references can help to reduce the deficit in the recognition. If they are available, they can be uploaded stating the employer, the position, the duration and the duties.\",\"Geburtsurkunde\":\"The birth certificate is required for recognition. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Vollmacht\":\"A signed main power of attorney is required so that all official procedures in the accelerated skilled worker procedure can be started. Without it, representation in the further process or by the future employer is not possible.\",\"Untervollmacht\":\"A signed sub-power of attorney is required so that all official procedures in the accelerated skilled worker procedure can be started. Without it, representation in the further process or by the future employer is not possible.\",\"Anerkennungsantrag\":\"A signed recognition application is required in order to apply for recognition of the foreign qualification.\",\"Arbeitsvertrag\":\"The employment contract is concluded between the candidate and the new employer. The start date is provisional at first, as work can only begin once the visa and the work permit have been received.\",\"Zusatzschreiben zum Arbeitsvertrag\":\"This is the addendum to the employment contract. It is provided by the employer and governs additional terms to the employment contract.\",\"Erklärung zum Beschäftigungsverhältnis vor Anerkennung\":\"This is the declaration of employment before recognition. It is signed by the employer for the pre-approval of the Federal Employment Agency.\",\"Erklärung zum Beschäftigungsverhältnis nach Anerkennung\":\"This is the declaration of employment after recognition. It is signed by the employer for the pre-approval of the Federal Employment Agency.\",\"Zusatzblatt\":\"This is supplementary sheet A. It is signed by the employer for the pre-approval of the Federal Employment Agency.\",\"Kandidatenvertrag\":\"The placement agreement is concluded between the candidate and the recruitment agency. It records which tasks and costs are covered by which side and which obligations apply during the process.\",\"Vorabzustimmung\":\"The pre-approval is the proof that the Federal Employment Agency has approved the employment. It is required for the visa to be granted by the German embassy. The document is provided and uploaded as soon as it is available.\",\"Visum\":\"A visa is required to enter Germany and serves as a work permit at the same time. Before the visa expires, a residence title must be applied for in Germany. Once the visa is available, it can be uploaded here.\",\"Aufenthaltstitel\":\"A residence title is required for a longer stay and for the work permit in Germany. It should be applied for about three months before the visa expires. The local immigration office is responsible and can often be contacted by email or via an online form.\",\"Anerkennungsurkunde\":\"Once received, the certificate of recognition as a skilled worker in Germany is uploaded here. It confirms the full equivalence of the professional qualification in Germany and is issued by the competent recognition authority.\",\"Impfnachweis\":\"Proof of the required vaccinations is recorded here. Some vaccinations are required by law (e.g. measles), others may be required by the employer. Missing vaccinations should be caught up on as soon as possible to avoid delays on entry.\",\"Kreditvertrag\":\"If a loan is needed to cover the first costs of the start in Germany, it can be requested in good time. A loan agreement is then drawn up setting out the amount and the repayment terms.\",\"Heiratsurkunde\":\"For family reunification or in the case of a name change, the authorities require a copy of the marriage certificate. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Pässe Familie\":\"Colour copies of the passports of all family members to be considered for family reunification are required. The passport should be valid for at least one year. In some federal states a plain colour copy is enough, but sometimes a certified copy is required.\",\"Geburtsurkunden Familie\":\"The birth certificates of all family members to be considered for family reunification are required. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Vollmacht Familie\":\"A signed power of attorney from the spouse is required so that all official procedures for the family can be handled. A power of attorney is also needed for children. Without it, representation in the process is not possible.\",\"Führungszeugnis Deutschland\":\"An (extended) certificate of good conduct is required for the application for the certificate of recognition. It can be applied for at the responsible registration office in Germany. The employer may also request this document for the first working day.\",\"Ärztliche Bescheinigung\":\"A medical certificate confirming fitness to work as a nurse is required. It is needed to apply for the certificate of recognition. Sometimes the employer also requests this document directly for the start of work.\",\"Weitere Antragsformulare\":\"Further application forms may be required during the process of immigrating to Germany.\",\"Weiterbildungsplan\":\"This is the further training plan, which is needed to achieve full recognition as a skilled worker in Germany.\",\"Anmeldebescheinigung zum Deutschkurs\":\"This is the registration confirmation for the German course.\",\"Anderes Dokument\":\"Further individual documents that are relevant to the process can be uploaded here.\",\"Einwilligung zur Datenverarbeitung\":\"This document governs the consent to data processing between the partner and the candidate. It permits the use and sharing of the data for the entire recruitment and immigration process. Personal data and documents may only be provided once this signed document is on file.\",\"Krankenversicherungsnachweis\":\"Proof of valid health insurance with a German health insurance provider is required for the visa application and for starting work in Germany.\",\"Qualifizierungsvereinbarung\":\"This is the agreement between the partner and the candidate on taking part in the language course in the home country. It governs all organisational and financial terms, such as the rules on withdrawal and repayment.\",\"Bescheinigung Soziales Jahr\":\"A certificate confirming completion of a voluntary social year (FSJ) is required. Depending on the country of origin, an apostille or legalisation may be necessary.\",\"Stipendienvertrag\":\"Proof of financial support or of a scholarship during the German learning phase in the home country is uploaded here.\",\"Meldebescheinigung\":\"The official certificate of registration confirming the place of residence in Germany is required. It is issued by the responsible registration office after moving in.\",\"Mitgliedsbescheinigung Krankenversicherung\":\"Confirmation of existing membership with a German health insurance provider is required. It contains the social security and pension numbers, which are important for payroll.\",\"Deckblatt Arbeitsvertrag (Heimatsprache)\":\"This is a summary of the key contents of the employment contract in the respective native language, for easier understanding.\",\"Vorvertrag / Einstellungszusage\":\"This is a binding commitment by the employer to hire at a later date, which can be issued before the final employment contract.\",\"Bestätigung Erhalt Informationsbroschüre\":\"Here the candidate confirms in writing that they have received the KDA information brochure.\",\"Flugreservierung / Flugticket\":\"A booking confirmation for the flight to Germany is uploaded here.\",\"Gebührenbescheide (externe Kostenübernahme)\":\"Fee notices or invoices that are covered by the candidate, the partner or the employer are uploaded here.\",\"Bestätigung Gültigkeit des Arbeitsvertrags\":\"A current confirmation from the employer that the planned employment relationship is still valid is required for the visa application.\",\"Vollmacht Anerkennung NV\":\"A signed power of attorney is required so that all official procedures for professional recognition in the standard procedure can be started. Without it, representation in the further process is not possible.\",\"Bescheinigung über Wohnraum\":\"Confirmation from the landlord or the employer of adequate accommodation in Germany is required for the visa procedure.\",\"Vollmacht Arbeitsmarktzulassung / ZAV\":\"A signed power of attorney is required so that all official procedures for the Federal Employment Agency's approval of the employment can be started. Without it, representation in the further process is not possible.\",\"Vollmacht Relocation\":\"A signed power of attorney is required so that all organisational procedures around entry and relocation can be started. Without it, representation in the further process is not possible.\",\"Einwilligung zur Veröffentlichung von Fotos (Photo Permission)\":\"The consent to the use of photo and video recordings as part of the placement process is stored here.\",\"Motivationsschreiben\":\"A motivation letter describing the personal and professional reasons for working in Germany is required.\",\"Aufenthaltserlaubnis §16 AufenthG\":\"A copy of the valid residence permit for completing education or qualification measures in Germany under § 16 AufenthG is required.\",\"Aufenthaltserlaubnis §18 AufenthG\":\"A copy of the valid residence permit for taking up qualified employment in Germany under § 18 AufenthG is required.\",\"Mietvertrag\":\"A signed rental agreement can be uploaded here as proof of residence in Germany.\",\"Foto\":\"A current passport photo is required for the application documents and the health insurance card.\",\"Nachweis über Fach- / Staatsprüfung\":\"The official document confirming that the professional or state final examination in the home country has been passed is required.\",\"Bildungsgutschein\":\"The education voucher from the Federal Employment Agency, confirming that the costs of qualification measures are covered, is uploaded here.\",\"Eingangsbestätigung Ausländerbehörde\":\"This is the immigration office's official confirmation of receipt of the applications or documents submitted.\",\"Führerschein\":\"A valid driving licence can be uploaded here.\",\"Beglaubigte Übersetzungen (komplett)\":\"All certified translations into German that are required for the recognition and visa procedure are uploaded here in a single file.\",\"Sonstige Dokumente AV Erstellung\":\"Additional documents needed to draw up and prepare the employment contract are recorded here.\",\"Personalfragebogen\":\"The employer's completed personnel questionnaire is required in order to record all relevant data for HR administration and payroll.\",\"Antragsformular Visa (VIDEX)\":\"The fully completed VIDEX form for applying for a national visa for Germany can be uploaded here.\",\"Antrag auf Erteilung / Verlängerung einer Aufenthaltserlaubnis\":\"This is the official application for the first issue or the extension of the residence permit in Germany.\",\"Reiseversicherung\":\"Proof of valid travel health insurance for the entry and the first days in Germany is required. Some embassies request this proof with the visa application.\",\"Vollmacht Bildungsgutschein (intern)\":\"An internal power of attorney is required in order to act as a representative and to submit applications relating to the education voucher.\",\"Beglaubigte Kopien (komplett)\":\"All certified copies that are required for the recognition and visa procedure are uploaded here in a single file.\",\"Erhebungsbogen Bildungsgutschein Arbeitnehmer\":\"The completed survey form recording the personal data for the education voucher is required.\",\"Antrag erweitertes Führungszeugnis\":\"This is the application for an extended certificate of good conduct at the registration office.\",\"Arbeitsvertrag nach Anerkennung\":\"This is the employment contract that takes effect once full recognition of the qualification in Germany has been received.\",\"Anmeldebestätigung Anpassungsmaßnahme\":\"The registration confirmation for the adaptation measure is required in order to prove participation in the necessary qualification in Germany. This document is issued by the respective educational institution.\"},\"createAsAdminDialog\":{\"title\":\"Add file\",\"selectedForUpload\":\"Selected for upload: \u003cstrong\u003e{name}\u003c/strong\u003e\",\"selectSection\":\"Select section\",\"selectDocumentType\":\"Select document type\",\"examDate\":\"Exam date (only for language certificates)\",\"selectStatus\":\"Select status\",\"alternativeName\":\"Name (only for document type \\\"Other document\\\")\",\"provenVaccinations\":\"Vaccinations proven in the provided document (only for vaccination proofs)\",\"hiddenForCandidate\":\"The document is not shown to the candidate because it is not required.\",\"creatingDocument\":\"Creating document ...\",\"uploadingDocument\":\"Uploading document ...\",\"documentCreated\":\"Document created\",\"documentCreatedSuccessfully\":\"The document was created successfully.\",\"documentCreationFailed\":\"Document could not be created\",\"documentCreationFa erview you can see all documents of your already recruited candidates\"},\"overviewPartners\":{\"title\":\"Documents\",\"intro\":\"In the following overview you can see all documents of your already recruited candidates\",\"noDocuments\":\"No documents\"},\"createVaccination\":{\"documentCreatedTitle\":\"Document created\",\"documentCreatedDescription\":\"The document was created successfully.\",\"createErrorTitle\":\"Document could not be created\",\"createErrorDescription\":\"The document could not be created. Code: {code}\",\"uploadErrorTitle\":\"Upload failed\",\"uploadErrorDescription\":\"The file could not be uploaded. Please contact Careloop support via info@careloop.io\",\"finalizeErrorTitle\":\"Document could not be finalized\",\"finalizeErrorDescription\":\"The document could not be finalized. Code: {code}\",\"creatingOverlay\":\"Creating document ...\",\"uploadingOverlay\":\"Uploading document ...\",\"selectedForUpload\":\"Selected for upload: \u003cstrong\u003e{filename}\u003c/strong\u003e\",\"vaccinationsProvenLabel\":\"Vaccinations proven in the provided document (only for vaccination proofs)\",\"dialogTitle\":\"Add file\"},\"updateAsAdminDialog\":{\"title\":\"Edit document\",\"documentUpdated\":\"Document has been updated\",\"documentUpdatedSuccessfully\":\"The document was updated successfully.\",\"documentSaveFailed\":\"Document could not be saved\",\"documentUpdateFailedWithCode\":\"The document could not be updated. Code: {cause}\",\"uploadFailed\":\"Upload failed\",\"uploadFailedContactSupport\":\"The file could not be uploaded. Please contact Careloop support via info@careloop.io\",\"alreadyUploadedNotice\":\"File has already been uploaded \u003clink\u003eview\u003c/link\u003e\",\"uploadingFile\":\"Uploading file ...\",\"savingDocument\":\"Saving document ...\",\"selectOtherFile\":\"Select a different file\",\"selectedForUpload\":\"Selected for upload: \u003cstrong\u003e{name}\u003c/strong\u003e\",\"selectSection\":\"Select section\",\"selectDocumentType\":\"Select document type\",\"examDate\":\"Exam date (only for language certificates)\",\"examStatus\":\"Exam status (only for language certificates)\",\"selectStatus\":\"Select status\",\"alternativeName\":\"Name (only for document type \\\"Other document\\\")\",\"provenVaccinations\":\"Vaccinations proven in the provided document (only for vaccination proofs)\"},\"areaDescription\":{\"Notwendige Dokumente\":\"These documents are mandatory so we can check whether you meet the requirements for the recognition process in Germany.\",\"Weitere Dokumente nach Aufnahme\":\"These documents are required once you have been admitted to the programme. They are a prerequisite for verification and for starting the placement process.\",\"Anerkennungsnachweise\":\"Depending on how far the recognition has progressed, different documents count as proof. With partial recognition it is the deficit notice, with full recognition before entry it is the full recognition notice. The recognition certificate confirms complete professional and language recognition and is usually only issued after entry.\",\"Zusätzliche Dokumente abhängig vom Bundesland des Arbeitgebers\":\"This section only becomes relevant after both sides have agreed. Depending on the federal state and the employer, further documents may be required.\",\"Weitere Dokumente nach beidseitiger Job Zusage\":\"These documents are only required for the immigration process after the candidate and the employer have agreed. Only from that point on can the paperwork be prepared and provided.\",\"Einreise, Relocation und Anpassungsmaßnahme\":\"This step starts once the (partial) recognition, the approval of the Federal Employment Agency and the visa are in place. It covers all documents for entry, relocation and the qualification measures in Germany.\",\"Individuell angeforderte Dokumente\":\"Individually requested documents are needed depending on the authority or the employer. This depends on your personal situation and can happen at any point in the process.\"},\"areaInfo\":{\"Notwendige Dokumente\":\"Required documents are shown at the beginning in order to verify the basic qualifications for the procedure in Germany.\",\"Weitere Dokumente nach Aufnahme\":\"Other onboarding documents are required as soon as the process starts and general paperwork for the profile is needed.\",\"Anerkennungsnachweise\":\"Proof of recognition is already shown during onboarding, as soon as the first documents from the recognition procedure are available or so that existing proof can be uploaded early.\",\"Zusätzliche Dokumente abhängig vom Bundesland des Arbeitgebers\":\"Additional documents depending on the federal state are shown once the candidate and the employer have both agreed.\",\"Weitere Dokumente nach beidseitiger Job Zusage\":\"Documents for the immigration process are shown once the official procedures for recognition, the approval of the Federal Employment Agency and the visa application start.\",\"Einreise, Relocation und Anpassungsmaßnahme\":\"Documents for entry, relocation and the qualification measure are shown once at least a partial recognition, the approval of the Federal Employment Agency and the visa are in place.\",\"Individuell angeforderte Dokumente\":\"Individually requested documents are shown as soon as further paperwork is needed for the process.\"},\"platformCurriculumVitae\":{\"action\":\"Upload platform CV here\",\"inProgress\":\"Uploading CV…\",\"succeededTitle\":\"CV attached\",\"succeededDescription\":\"The platform CV has been uploaded and is waiting for the candidate to sign it.\",\"failedTitle\":\"The CV could not be attached\",\"failedDescription\":\"Please try again or contact Careloop support at info@careloop.io\"}},\"jobOfferStages\":{\"Absage durch Arbeitgeber\":\"Rejection by employer after interview\",\"Absage durch Kandidat nach dem Interview\":\"Rejection by candidate after the interview and job offer\",\"Abbruch durch Kandidaten nach Jobzusage\":\"Withdr  unemployment insurance have been deducted. You receive this net salary after recognition once you are fully recognized as a nursing professional in Germany. It depends on your situation. The net salary shown here was calculated on the basis of a single person without children. If you have children and/or are married, the net salary may be higher. \",\"tipVacationDays\":\"These are paid vacation days. This means the employee continues to receive their full salary even when taking vacation.\",\"tipFixedTermContract\":\"In Germany there are fixed-term and permanent employment contracts. Fixed-term means that an employment contract has a set end date. Permanent means that it has no end date.\",\"tipAdditionalEarnings\":\"The salary shown is the base salary. In nursing it is common to receive so-called allowances or supplements. These are additional payments that you receive in certain situations on top of your regular salary or wage, in addition to the base salary.\",\"tipAdaptationMeasure\":\"The adaptation measure is necessary to become fully recognized as a nursing professional in Germany. Here you can see which measure the employer offers and who carries out this measure.\",\"tipGermanCourse\":\"The B2 certificate in German is necessary to become fully recognized as a nursing professional in Germany. Here you can see who runs the B2 German course and by when the course must be completed.\",\"tipRequiredVaccinations\":\"The employer requires these vaccinations for working in their facility, to protect all employees and patients. These vaccinations must be valid and written proof must be provided. Without these vaccinations, the start of work may be delayed until the vaccinations and full vaccination protection are in place.\",\"acceptOffer\":\"Accept job offer\",\"acceptOfferConfirm\":\"Accept job offer?\",\"acceptOfferHint\":\"Note: Please be aware that your remaining job offers will thereby be automatically rejected.\",\"rejectOffer\":\"Reject job offer\",\"cancel e of birth, nationality, address\",\"dataCategoryJobPreferences\":\"\u003cstrong\u003eJob preferences:\u003c/strong\u003e For example desired department, salary expectations, place of work\",\"dataCategoryExperience\":\"\u003cstrong\u003eProfessional experience and qualifications:\u003c/strong\u003e For example years of experience, departments, certificates\",\"dataCategoryImmigration\":\"\u003cstrong\u003eImmigration and employment process:\u003c/strong\u003e For example visa data, recognition status, contract details, data of your family members\",\"dataCategoryCourse\":\"\u003cstrong\u003eCourse and learning information:\u003c/strong\u003e For example enrollments in language courses, exam progress\",\"sharingHeading\":\"3. With whom do we share your data?\",\"sharingIntro\":\"So that we can support you as best as possible in the application and immigration process, we share your personal data with external parties where this is necessary:\",\"sharingEmployer\":\"\u003cstrong\u003eEmployers:\u003c/strong\u003e To support you in the application process (for example name, date of birth, professional experience, qualifications, visa data)\",\"sharingRecruitmentPartner\":\"\u003cstrong\u003eYour recruitment partner:\u003c/strong\u003e To support you in the job search and application\",\"sharingServiceProviders\":\"\u003cstrong\u003eService providers:\u003c/strong\u003e For organizing travel, translations, insurance (for example name, date of birth, passport data)\",\"sharingExaminationOffices\":\"\u003cstrong\u003eExamination offices:\u003c/strong\u003e For language and recognition exams\",\"sharingAuthorities\":\"\u003cstrong\u003eAuthorities:\u003c/strong\u003e To obtain your work permit and recognition of your qualifications.\",\"moreInfoLink\":\"You can find more detailed information on data protection for candidates \u003clink\u003ehere\u003c/link\u003e.\",\"consentHeading\":\"4. Consent\",\"consentText\":\"With your consent, you agree that we may collect, process, and share your above-mentioned personal data with the necessary parties. Processing this data is necessary to make you suitable job offers and to support you during the application and immigration process. You can withdraw your consent at any time without giving reasons, by phone, in writing, or by email (e.g. to \u003clink\u003edatenschutz@careloop.io\u003c/link\u003e).\",\"analysisTitle\":\"Consent for analysis and optimization\",\"analysisText\":\"I consent to my data being used for analysis and optimization purposes so that we can improve the quality of our services. You can withdraw your consent at any time without giving reasons, by phone, in writing, or by email (e.g. to \u003clink\u003edatenschutz@careloop.io\u003c/link\u003e).\"},\"candidateCertificates\":{\"noDataAvailable\":\"No data available\",\"title\":\"{level} Certificate\",\"notAvailable\":\"not available\",\"label\":{\"status\":\"Status:\",\"expiredParenthetical\":\"(expired)\",\"examDate\":\"Examination date:\",\"validUntil\":\"Valid until:\",\"valid\":\"valid\",\"examOffice\":\"Examination body:\",\"plannedEntry\":\"Planned entry:\",\"notYetKnown\":\"not yet known\",\"requiredUntil\":\"Required until:\",\"note\":\"Note:\"},\"text\":{\"expired\":\"Expired: {date}\",\"requiredUntil\":\"{expired, select, true {New {title} } other {}}required until: {value}\",\"validUntil\":\"Valid until: {date}\",\"exam\":\"Examination: {date}\"},\"requiredUntilText\":{\"notNeededPresent\":\"not required, already provided\",\"notNeededHigherPresent\":\"not required, as at least a {certificate} is present\",\"dependsOnEmployer\":\"depends on the employer\",\"notNeededB2Required\":\"not required, as at least a B2 certificate is required\"},\"note\":{\"valid\":\"The {title} is currently valid.{jobStarted, select, false { Please note that a German language certificate is only valid for one year for the German embassy.} other {}}\",\"higherPresent\":\"A {title} is not required, as at least a {certificate} is present.\
